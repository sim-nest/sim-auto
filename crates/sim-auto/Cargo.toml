[package]
name = "sim-auto"
version = "0.2.1"
edition = "2024"
license = "MPL-2.0"
description = "Bootloader-backed automotive bay command surface for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-auto"
homepage = "https://github.com/sim-nest/sim-auto"

[dependencies]
sim-codec-lisp = { version = "0.2.1" }
sim-kernel = { version = "0.2.0" }
sim-lib-view-bay = { version = "0.2.0", path = "../sim-lib-view-bay" }
sim-run-core = { version = "0.3.0" }
sim-value = { version = "0.2.0" }

[dev-dependencies]
sim-kernel = { version = "0.2.0", features = ["test-support"] }

[lints]
workspace = true
