[package]
name = "sim-lib-auto-parts"
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
description = "Modeled automotive parts catalog lookup and supplier ordering for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-auto"
homepage = "https://github.com/sim-nest/sim-auto"

[dependencies]
sim-citizen = { version = "0.2.0" }
sim-citizen-derive = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-auto-core = { version = "0.2.0", path = "../sim-lib-auto-core" }
sim-lib-auto-vendor = { version = "0.2.0", path = "../sim-lib-auto-vendor" }

[dev-dependencies]
sim-kernel = { version = "0.2.0", features = ["test-support"] }

[lints]
workspace = true
