[[route]]
id = "route/add-automotive-workflow"
task = "Add an automotive diagnostic or service workflow"
audiences = ["code", "framework", "user"]
steps = [
  { feature = "feature/sim-auto/automotive-runtime", why = "The automotive runtime row owns the shared contracts, bounded lanes, codec, and view integration." },
  { specimen = "spec-test/sim-auto/crates/sim-lib-auto-order/tests/conformance", why = "The conformance specimen checks the order boundary through the public runtime contract." },
]

[[feature]]
id = "feature/sim-auto/guarded-vendor-operations"
title = "Generic-gated automotive vendor operations"
summary = "Adapt explicit automotive manifest declarations to the domain-neutral operation gate with exact approval and replay-safe dispatch."
owner = "crate/sim-lib-auto-vendor"
audiences = ["code", "framework"]
guidance = "Author an OpCap for every vendor operation and dispatch through guard_vendor_operation. Keep approval verification/use and record sinks as adapters; do not infer gate policy from operation names or reintroduce an automotive gate implementation."
claims_anchors = ["anchor/crate/sim-lib-auto-vendor"]
claims_specimens = ["spec-test/sim-auto/crates/sim-lib-auto-vendor/src/gate_tests"]
composes = ["crate/sim-lib-operation-gate"]
