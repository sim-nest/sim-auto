# GitHub Actions CI for this repository.
name: ci
on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim-auto
    env:
      SIMDOC_TOOLING_MANIFEST: ${{ github.workspace }}/sim-tooling/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: sim-auto
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-tooling
          path: sim-tooling
      - name: Check out shared simdoc siblings
        uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-citizen
          path: sim-citizen
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-codecs
          path: sim-codecs
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-foundation
          path: sim-foundation
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-kernel
          path: sim-kernel
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-shape
          path: sim-shape
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo run -p xtask -- check-file-sizes
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run -p xtask -- simdoc --check
        env:
          SIMDOC_TOOLING_MANIFEST: ${{ github.workspace }}/sim-tooling/Cargo.toml
