schema = "sim.features"

[enforcement.audience]
code = "strict"
framework = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-auto/generated-docs"
title = "Repository documentation surface"
summary = "Publish generated package, card, rustdoc, and Index facts for the automotive runtime and recipes."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this row when checking the generated documentation and Index lane for automotive support."
claims_anchors = [
  "anchor/cli/xtask",
  "anchor/crate/xtask",
  "anchor/doc/generated/card-index",
  "anchor/doc/generated/feature-map",
  "anchor/doc/generated/provenance",
  "anchor/doc/generated/repo-contract",
  "anchor/doc/generated/rustdoc-index",
  "anchor/doc/generated/sim-index-fragment",
  "anchor/repo/sim-auto",
]
claims_surfaces = [
  "cli/xtask",
  "docs/sim-auto/generated",
]

[[feature]]
id = "feature/sim-auto/automotive-runtime"
title = "Automotive diagnostic and service framework"
summary = "Load bounded automotive diagnostics, vehicle information, parts, service ordering, vendor access, UDS codecs, and bay views through one runtime family."
owner = "crate/sim-lib-auto-core"
audiences = ["code", "framework", "user"]
guidance = "Use the automotive libraries for modeled or site-backed vehicle workflows. Keep UDS framing in sim-codec-uds, shared runtime contracts in sim-lib-auto-core, and lane-specific behavior in its owning auto library."
claims_anchors = [
